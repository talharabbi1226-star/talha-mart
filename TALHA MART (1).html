async function upl(i){try{const a=await claude.use('assets');if(!a)return tg('আপলোড এখানে চালু নেই');for(const f of i.files){const r=await a.upload(f);_p.imgs.push(r.url)}$('#ip').textContent=_p.imgs.length+' টি ছবি আপলোড হয়েছে ✓'}catch(e){tg('আপলোড ব্যর্থ')}}
function psave(e,id){e.preventDefault();const f=e.target,sp=s=>s.split(',').map(x=>x.trim()).filter(Boolean),o={..._p,name:f.name.value,cat:f.cat.value,price:+f.price.value,disc:+f.disc.value||0,stock:+f.stock.value||0,emoji:f.emoji.value||'📦',sizes:sp(f.sizes.value),colors:sp(f.colors.value),desc:f.desc.value,feat:f.feat.checked?1:0,nw:f.nw.checked,flash:f.flash.checked};if(id)Object.assign(P(id),o);else S.prods.unshift({...o,id:'p'+Date.now(),sold:0});cl();saveS();return false}

async function render(){const h=location.hash.slice(1)||'home',a=$('#app');$('#nav').innerHTML=`<a href="#home">হোম</a><a href="#shop" onclick="fil.cat='';q=''">সব পণ্য</a>`+S.cats.slice(0,8).map(c=>`<a href="#shop" onclick="fil.cat='${c.id}';q=''">${E(c.name)}</a>`).join('')+'<a href="#track">অর্ডার ট্র্যাক</a>';
$('#ct').innerHTML=`${E(S.set.addr)}<br>${E(S.set.mail)}<br><a href="https://facebook.com" onclick="this.href='${E(S.set.fb)}'" target="_blank" rel="noopener">Facebook Page</a>`;$('#wa').href='https://wa.me/'+S.set.wa;
let v;if(h==='home')v=home();else if(h==='shop')v=shop();else if(h.startsWith('p-'))v=prod(h.slice(2));else if(h==='checkout')v=chk();else if(h.startsWith('track'))v=await track(h.slice(6));else if(h==='account')v=acct();else if(h==='wishlist')v='<h3 class="sec">উইশলিস্ট</h3>'+gr(S.prods.filter(p=>wish.includes(p.id)));else if(h==='contact')v=contact();else if(h==='admin')v=admin();else v=home();
if(h!==render.last){scrollTo(0,0);render.last=h}a.innerHTML=v;if(h==='checkout'&&cart.length)tot();document.title=h.startsWith('p-')&&P(h.slice(2))?P(h.slice(2)).name+' | TALHA MART':'TALHA MART – সব পণ্য এক ঠিকানায়'}
addEventListener('hashchange',render);
setInterval(()=>{const c=$('#cd');if(!c)return;const d=new Date(S.set.flash)-Date.now();c.textContent=d>0?[d/36e5|0,(d/6e4|0)%60,(d/1e3|0)%60].map(n=>String(n).padStart(2,'0')).join(':'):'শেষ'},1000);
(async()=>{saveC();const l=ls('tm_state');if(l)S=l;O=ls('tm_orders')||[];render();
try{user=await claude.use('user');db=await claude.use('db')}catch(e){}
if(user){try{adm=user.isOwner();uid=await user.id();if(adm)$('#un').textContent='অ্যাডমিন'}catch(e){}$('#un').textContent=adm?'অ্যাডমিন':'অ্যাকাউন্ট'}
if(db){adm=adm&&true;db.doc('shop/state').onSnapshot(s=>{if(s.exists&&s.data().prods)S=s.data();else if(adm)db.doc('shop/state').set(JSON.parse(JSON.stringify(S))).catch(()=>{});render()},()=>{});
if(adm)db.collection('orders').onSnapshot(s=>{O=s.docs.map(d=>d.data());render()},()=>{});
else if(uid)db.collection('orders').where('uid','==',uid).onSnapshot(s=>{O=s.docs.map(d=>d.data());render()},()=>{})}
else{adm=true;$('#un').textContent='ডেমো'}
render()})();
